packages: []

verifyDepsBeforeRun: warn

# Keeps the registry proxy's rotating shard hosts (ms-feed-N.pkgs.visualstudio.com)
# out of pnpm-lock.yaml; policy in package.json#pnpmTarballUrlPolicy. From
# stuffbucket/pnpm-hooks@4935cd6, with apply-pnpm-tarball-policy.mjs.
pnpmfile: .pnpmfile.cjs

# Supply chain: a new version must be a day old before it resolves, and
# dependencies can't pull git or tarball URLs. No trustPolicy: the registry
# proxy drops publish-trust metadata (provenance, trusted publisher) for some
# versions, so a no-downgrade check flags trusted packages as takeovers.
minimumReleaseAge: 1440
blockExoticSubdeps: true

overrides:
  esbuild: 0.28.2
  tar: 7.5.22

allowBuilds:
  esbuild: true
