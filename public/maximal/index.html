<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
        <title>Redirecting to maximal…</title>
        <!-- Keep the historical /maximal/ route inside this Pages project as a
          redirect to the current site root. -->
        <link rel="canonical" href="https://stuffbucket.github.io/maximal-site/" />
    <meta name="robots" content="noindex" />
        <meta http-equiv="refresh" content="0; url=/maximal-site/" />
    <script>
      // Immediate, history-replacing redirect that preserves any query/hash.
       location.replace("/maximal-site/" + location.search + location.hash);
    </script>
    <style>
      body {
        font: 16px/1.5 system-ui, sans-serif;
        margin: 4rem auto;
        max-width: 32rem;
        padding: 0 1rem;
      }
    </style>
  </head>

    <p>Redirecting to <a href="/maximal-site/">maximal</a>…</p>
  </body>
</html>
