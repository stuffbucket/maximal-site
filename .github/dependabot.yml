# Security updates only, as in stuffbucket/maximal: `open-pull-requests-limit:
# 0` turns off routine version-update PRs, but Dependabot still opens security
# fixes, and needs this file to know which package manager owns each
# directory. Each ecosystem's security fixes arrive as one grouped PR.
#
# Actions are pinned by commit SHA with a version comment (`@<sha> # vX.Y.Z`);
# Dependabot updates both. Tool versions (Node, pnpm, Bun, mise) are pinned in
# mise.toml and mise.lock and updated by hand.

version: 2
updates:
  # pnpm-managed (the npm ecosystem reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Any version update waits a week after release; security fixes don't.
    cooldown:
      default-days: 7
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Any version update waits a week after release; security fixes don't.
    cooldown:
      default-days: 7
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: ci
