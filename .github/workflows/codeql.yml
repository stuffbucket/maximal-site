name: CodeQL

# Scans the site's JavaScript/TypeScript (Astro components, scripts, inline
# page scripts) and the workflows themselves. No build is needed for either.
# Changes that touch only prose, screenshots, or the model catalog skip the
# scan; the weekly run covers everything so new queries reach unchanged code.
# CodeQL is not a required status check, so a skipped scan never blocks a
# merge.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "public/screenshots/**"
      - "public/models/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "public/screenshots/**"
      - "public/models/**"
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its in-flight scan; main and scheduled scans
# each get their own group.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
